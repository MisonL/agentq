shared:
  pueue_directory: 'C:/ProgramData/AgentQ/data'
  runtime_directory: 'C:/ProgramData/AgentQ/runtime'
  host: '127.0.0.1'
  port: '6924'
  pid_path: 'C:/ProgramData/AgentQ/runtime/pueued.pid'
client:
  read_local_logs: true
  show_confirmation_questions: false
  edit_mode: 'toml'
daemon:
  pause_group_on_failure: false
  pause_all_on_failure: false
  compress_state_file: true
  shell_command:
    - '__AGENTQ_GIT_BASH_RUNTIME__'
    - '-lc'
    - '{{ pueue_command_string }}'
