# Publish the Skill directory to npm when a version tag is pushed.
#
# What this workflow can and cannot do, stated here because the distinction is
# the whole point of the package:
#
#   * It publishes the 30 files under `skill/` plus `bin/agentq-skill.js`, whose
#     only job is to COPY them somewhere.  `npx agentq-skill@<version> --dest ..`
#     gets a user the right bytes for a version; it does NOT install AgentQ.
#     Deployment is still: stage a platform directory on the TARGET host and run
#     that host's installer (skill/references/install.md).
#   * npm is not required on the target host, and no step here talks to one.
#
# Why a separate workflow instead of a job inside release.yml: that file's own
# comment promises least privilege -- "no job writes to the repository or calls
# the API" -- and publishing needs an OIDC token.  Widening the release gate's
# permissions to cover a second concern would quietly retire that promise.
# Here the wider permission is scoped to one job and justified below.
name: npm

on:
  push:
    tags: ['v*']
  # Manual runs pack and dry-run the publish: a real publish from a dispatch
  # would bypass the tag check above, and the tag is the only thing that ties
  # these bytes to a version.
  workflow_dispatch:

# `contents: read` for the checkout; `id-token: write` for npm provenance, which
# is what lets a consumer check that this tarball came from THIS commit of THIS
# repository rather than from a laptop.
#
# There is no NPM_TOKEN secret today, so the publish step VERIFIES and STOPS
# rather than failing: a repository without a publish credential has not broken
# its release, and a red run on every tag would say exactly that.  Add the
# secret and the same workflow publishes with no change to this file.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # `NPM_TOKEN`, deliberately NOT `NODE_AUTH_TOKEN`.  Measured on the first two
    # tags this workflow saw: `setup-node` defaults its `token` input to
    # `github.token`, exports it as `NODE_AUTH_TOKEN`, and a step `if:` that tests
    # `env.NODE_AUTH_TOKEN` then sees that token even when the repository has no
    # npm secret at all -- so the guard passed and `npm publish` ran anonymously.
    # npm reports an unauthenticated PUT as `E404 ... Not found`, which reads like
    # "the package does not exist" and sent me looking in the wrong place twice.
    #
    # The decision itself lives in the shell below, not in an expression: it is
    # then the same code here and in a local run, and it can be tested.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          # The pack verifier compares the tarball against `git ls-files`, so a
          # shallow checkout is enough -- but the tag is also compared with the
          # recorded version, and that needs the tag object.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          # The copier only uses `fs` and `crypto`; 18 is the floor declared in
          # package.json's engines, so that is what is tested here.
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          # No default: the action would otherwise export `github.token`, which
          # has no publish rights and would turn "not configured" into a 404.
          token: ${{ secrets.NPM_TOKEN }}

      # The tag must name the version every record carries.  release.yml already
      # asserts this for its own trigger; repeating the ONE comparison here is
      # deliberate rather than extracting a shared script: this workflow can run
      # on workflow_dispatch (no tag), and a shared script would then need a
      # no-tag mode whose absence would be invisible.
      # The tag must be ANNOTATED before its name is trusted to identify a
      # release.  release.yml has asserted this since 2026-11-20; this workflow
      # did not, so a lightweight tag could reach `npm publish` while the release
      # workflow refused the same tag -- two workflows disagreeing about whether
      # a tag is publishable.  Measured 2026-11-26 (audit): v0.1.43 is a
      # lightweight tag and npm.yml went green on it four times, three of which
      # reached the publish decision.
      #
      # `git cat-file -t refs/tags/<name>` reads the object the REF points at,
      # and actions/checkout on a tag push points that ref at the COMMIT -- so
      # cat-file alone answers `commit` for a correctly annotated tag.  The ref
      # must be re-fetched first.  I first wrote this step without the fetch,
      # reasoning that `fetch-depth: 0` would keep the tag object; the CI run
      # for v0.1.49 answered `commit` and failed, which is the gate doing its
      # job on its own author.  release.yml has carried both halves since
      # 2026-11-20 for the same measured reason.
      - name: Require an annotated tag
        if: github.event_name == 'push'
        run: |
          set -eu
          if ! git fetch --no-tags --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"; then
            echo "cannot fetch refs/tags/${GITHUB_REF_NAME} to inspect its object type" >&2
            echo "The publish gate inspects the ref itself; retry the tag push." >&2
            exit 1
          fi
          object_type=$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || true)
          if [ "$object_type" != tag ]; then
            echo "tag $GITHUB_REF_NAME is not an annotated tag (git cat-file -t answered '${object_type:-unknown}')." >&2
            echo "Create it with \`git tag -a\` and push it again: the annotation carries the release notes and the back-link." >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME is an annotated tag"

      - name: Check the tag against package.json
        if: github.event_name == 'push'
        run: |
          set -eu
          tag_version=${GITHUB_REF_NAME#v}
          manifest_version=$(node -p 'require("./package.json").version')
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $manifest_version" >&2
            exit 1
          fi
          echo "package.json version $manifest_version matches tag $GITHUB_REF_NAME"

      # The gate that makes publishing safe.  It packs with the same npm that
      # will publish, unpacks the result, and compares file set, bytes, modes and
      # the two canonical copies against the git index.  A mismatch means the
      # tarball is not what the repository holds, and a published tarball cannot
      # be taken back after 72 hours.
      - name: Verify the tarball against the tree
        run: node scripts/verify-pack.js

      # One step, one decision, in shell.  Measured behaviour that shapes it:
      #   * an unauthenticated `npm publish` answers `E404 ... PUT <registry>/<pkg>
      #     ... Not found` -- not 401 -- so a missing credential is
      #     indistinguishable from a missing package unless the code checks first;
      #   * `--provenance` needs the real upload, so the dry run drops it.
      - name: Publish, or report why not
        run: |
          set -eu
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::notice title=npm: verified but not published::No NPM_TOKEN secret is configured."
            {
              echo '### npm: verified, not published'
              echo
              echo 'No `NPM_TOKEN` secret is configured, so `npm publish` was skipped.'
              echo '`scripts/verify-pack.js` did run and pass: the tarball matches the'
              echo 'committed tree in file set, bytes and modes.'
              echo
              echo 'To publish: create the package on npmjs.com, add a token with publish'
              echo 'rights as the `NPM_TOKEN` secret, and this workflow will upload on the'
              echo 'next tag. Provenance comes from the OIDC token it already requests.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            npm publish --dry-run --access public
            echo "dry run only: nothing was published"
            exit 0
          fi
          npm publish --provenance --access public --tag latest
