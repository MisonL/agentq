# The quality gate.  Each job runs what only that platform can run:
#
#   linux   - the full suite with a real Pueue runtime (sandbox.sh downloads a
#             pueue binary and verifies it against the SHA built into the
#             installer, then starts pueued) and a user-level sshd
#   macos   - the quick suite, on the only platform that has plutil -lint
#   windows - the PowerShell client checks under real PowerShell 5.1, not pwsh 7
#             (AGENTQ_SMOKE_PWSH=powershell.exe); pwsh 7 does not reproduce the
#             PS 5.1 quoting and `-Command -` behaviours this project has
#             already shipped fixes for
#
# run-tests.sh exits 0 when checks skip -- skipping is a property of the
# environment, not of the code under test (its own comment says so).  So no job
# here trusts an exit code alone: each one asserts the shape of the summary.
# The tag-vs-version gate lives in release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install check dependencies
        # smoke/01 parses the .yml assets (pyyaml), re-parses the shell assets
        # under zsh, and lints the plists (xmllint); 07 and 17 start their own
        # sshd on a high port, which needs the binary and its privilege
        # separation directory; smoke/05's shellcheck lock covers the nine
        # shell assets, the repo's own 31 scripts and every comment line that
        # could be a directive, and WITHOUT the tool it degrades to
        # `shellcheck=absent` and exits 0 -- the assertion below is what keeps
        # that degradation from reading as green.  pwsh and jq are already on
        # the runner image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-utils openssh-server python3-yaml shellcheck zsh
          sudo mkdir -p /run/sshd
      - name: Run the full suite against a real runtime
        run: |
          ./sandbox.sh up
          status=0
          AGENTQ_SMOKE_HOME=/tmp/aqsb/home/.agentq ./run-tests.sh >smoke.log 2>&1 || status=$?
          cat smoke.log
          exit "$status"
      - name: Assert the full suite really ran
        if: always()
        run: |
          if [ ! -f smoke.log ]; then
            echo 'no smoke.log -- the suite did not run' >&2
            exit 1
          fi
          # At most one structural skip is allowed here, and it is named:
          # smoke/16 also scans the machine-local memory directory
          # ($HOME/.claude/projects/...), which a checkout cannot provide -- it
          # is private per-developer state that must NOT be committed, so an
          # empty stand-in directory would be a fake green, not a fix.  The
          # check itself still runs its REPO half (the half that matters in CI:
          # the leak rules against checked-in content) and reports the memory
          # half as NOT-verified.  Any OTHER skip or partial -- including a
          # different reason from 16 -- goes red.  The summary may read 0 or 1
          # skipped: 0 when a self-hosted runner happens to have the memory
          # directory, 1 on a hosted runner (where it never exists); either way
          # the line above already pins that no OTHER check skipped.
          if grep -E '^(SKIP|PART) ' smoke.log \
               | grep -vE '^SKIP +16-no-host-identifiers +.*memory directory not present'; then
            echo 'a check skipped or was only partially verified beyond the one named structural skip' >&2
            exit 1
          fi
          grep -qE '^PASS checks: [0-9]+ ran, [01] skipped, 0 partial, 0 failed' smoke.log
          # The check COUNT must be pinned independently of the filesystem.
          # `run-tests.sh` already compares `ran` against the number of files it
          # FOUND, which is not a gate: delete a smoke file and both numbers
          # shrink together, so every assertion above stays green while the
          # suite silently covers less.  This list is the independent record --
          # adding a check means adding it here, and deleting one without
          # striking it here turns the job red.  Order and spelling are pinned
          # too: a renamed check is a different check, and the NOT-covered gate
          # below matches by name.
          expected_checks='01-syntax-and-parity 02-error-contract 03-protocol-roundtrip 04-degraded-contracts 05-client-contract 06-lock-contention 07-client-transport 08-jq-path-arguments 09-native-argument-quoting 10-installer-invariants 11-installer-contract 12-ps-client-contract 13-ps-installer-contract 14-remote-command-length 15-transient-pueue-failure 16-no-host-identifiers 17-askpass-credential 18-record-metadata-contract 19-sshp-contract 20-ps-native-argv-roundtrip 21-install-client-contract 22-launcher-contract 23-durable-move-contract 24-git-bash-launcher-contract 25-ps-client-installer-contract 26-record-read-paths 27-record-write-paths 28-client-interrupt 29-jq-reserved-identifiers'
          actual_checks=$(grep -E '^(ok|SKIP|PART|NCOV|FAIL) +[0-9]{2}-' smoke.log \
            | sed -E 's/^(ok|SKIP|PART|NCOV|FAIL) +([0-9]{2}-[a-z0-9-]+) .*/\2/' \
            | sort -u | tr '\n' ' ' | sed 's/ $//')
          expected_sorted=$(printf '%s\n' $expected_checks | sort | tr '\n' ' ' | sed 's/ $//')
          if [ "$actual_checks" != "$expected_sorted" ]; then
            echo 'the set of checks that reported does not match the pinned list' >&2
            echo "pinned:  $expected_sorted" >&2
            echo "reported: $actual_checks" >&2
            echo 'missing:' >&2
            for c in $expected_sorted; do
              case " $actual_checks " in *" $c "*) : ;; *) echo "  $c" >&2 ;; esac
            done
            echo 'unexpected:' >&2
            for c in $actual_checks; do
              case " $expected_sorted " in *" $c "*) : ;; *) echo "  $c" >&2 ;; esac
            done
            exit 1
          fi
          expected_count=$(printf '%s\n' $expected_checks | grep -c . || true)
          reported_count=$(grep -cE '^(ok|SKIP|PART|NCOV|FAIL) +[0-9]{2}-' smoke.log || true)
          if [ "$reported_count" != "$expected_count" ]; then
            echo "reported $reported_count check lines, pinned list has $expected_count" >&2
            exit 1
          fi
          # smoke/05's shellcheck lock is TOOL-GATED: without shellcheck it
          # prints `shellcheck=absent` and still exits 0, so neither the exit
          # code nor the PASS line can tell a linted run from an unlinted one.
          # Both enumerations must have run: the assets AND the repo scripts.
          # A check that degrades to "not linted" must turn this job red, not
          # read green -- the same rule smoke/01's `ps1_static=ok` follows.
          # The POSIX parse arm (dash -n over the five `#!/bin/sh` assets) is
          # gated the same way and must not degrade either: it is the ONLY
          # layer that parses those assets under the grammar they actually
          # ship with, since bash -n and zsh -n both accept bashisms dash
          # rejects (measured 2026-10-24).  ubuntu-latest always has dash.
          grep -qE 'shellcheck=checked\([1-9][0-9]*\) scriptcheck=checked\([1-9][0-9]*\) directives=checked\([1-9][0-9]*\) posix=checked\([1-9][0-9]*\)' smoke.log
          # NOT-covered is platform-expected, so it is neither skipped nor
          # partial and must not disturb the line above.  But the word has to
          # be pinned somewhere: every check allowed to admit it must be in the
          # known set (the Windows-only installers/launcher contract, plus 12's
          # `ps51=NOT-covered`, which appears whenever pwsh is not PS 5.1 --
          # exactly this job's situation).  A NEW `NOT-covered` -- a check that
          # has never claimed a platform gap before joining this line -- is the
          # failure this gate is for.  (The gate is by CHECK NAME: a known check
          # adding a further NOT-covered token is not distinguished.  Wording
          # corrected 2026-10-13 -- the earlier phrasing "silently stopped
          # covering" overclaimed what a name-level gate can see.); before the
          # NCOV bucket existed the word classified as `ok` with no gate reading
          # it at all.  The test is a SUBSET test, not equality:
          # a known name DROPPING OUT (e.g. 12 when pwsh happens to be 5.1) means
          # the platform covered more, which is good, not a red build.  An
          # unknown name appearing is red in every direction.
          # 05 self-reports a lowercase not-covered when no strict-POSIX shell
          # (dash/busybox/ksh refusing ${x//pat/}) is on PATH -- a runner
          # property, so it is a legitimate platform-gap declaration here too.
          # The known set lives in smoke/not-covered-known.txt, which
          # run-tests.sh reads for its LOCAL gate too -- one list, two
          # consumers, so a name added for one cannot be missing from the
          # other.  (Until 2026-10-27 the list existed only here and the local
          # run printed the NOT-covered line and exited 0: measured on a
          # fixture tree, local PASS vs this gate's exit 1.)
          known_ncov=" $(grep -vE '^[[:space:]]*(#|$)' smoke/not-covered-known.txt 2>/dev/null | tr '\n' ' ' || true)"
          if [ -z "${known_ncov// /}" ]; then
            echo 'smoke/not-covered-known.txt is missing or names no check' >&2
            exit 1
          fi
          unknown=''
          for name in $(grep -E '^NOT-covered:' smoke.log | sed -E 's/^NOT-covered: [0-9]+ check\(s\) declared platform-unverifiable sub-parts: //'); do
            case "$known_ncov" in
              *" $name "*) : ;;
              *) unknown="$unknown $name" ;;
            esac
          done
          if [ -n "$unknown" ]; then
            echo "NOT-covered reported by check(s) not in the known platform-expected set:$unknown" >&2
            grep -E '^NOT-covered:' smoke.log >&2 || echo '(no NOT-covered line at all)' >&2
            exit 1
          fi

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Ensure pyyaml for the .yml assets
        # smoke/01's tool inventory reports skipped(tool-pyaml) without it and
        # the summary assertion below turns red -- which is the point of the
        # inventory: a missing parser must not read as a green parse.
        #
        # A throwaway venv, not `pip install --user`: Homebrew's python3 on this
        # runner is externally managed (PEP 668), so `--user` is refused with
        # `error: externally-managed-environment` and the job dies before the
        # suite starts.  The venv is added to PATH so the `python3` that
        # smoke/01 probes for is the one that has pyyaml.
        run: |
          python3 -m venv "$RUNNER_TEMP/aq-venv"
          "$RUNNER_TEMP/aq-venv/bin/pip" install --quiet pyyaml
          echo "$RUNNER_TEMP/aq-venv/bin" >> "$GITHUB_PATH"
      - name: Run the quick suite
        run: |
          status=0
          ./run-tests.sh --quick >smoke.log 2>&1 || status=$?
          cat smoke.log
          exit "$status"
      - name: Assert the assets were really checked
        if: always()
        run: |
          if [ ! -f smoke.log ]; then
            echo 'no smoke.log -- the suite did not run' >&2
            exit 1
          fi
          # ps1=7: the PowerShell parser ran over all seven .ps1 assets.
          # ps1_static=ok: the PS AST rules ran AND self-calibrated -- a rule
          # that had quietly stopped matching prints skipped(...) instead.
          # tool_full=6/6: no probe tool (pwsh, xmllint, zsh, pyyaml, cmp,
          # find) was missing.  A `skipped(` marker means part of 01 did not
          # run and the job must not read as green.
          # kinds=checked: the per-kind census compared every parse arm's
          # count against the tree (measured 2026-10-26: a one-letter glob
          # typo in any of the five arms left that kind at 0 with exit 0).
          # summary_census=N: the summary-line coverage-count lock enumerated
          # the smoke checks (measured 2026-10-27: three checks printed a
          # coverage number nothing computed).  Pinned as present and
          # non-zero, not to a value, so adding a check does not need this
          # line edited -- 01's own zero-gate is what refuses a blind census.
          grep -qE 'ps1=7 ps1_static=ok .*tool_full=6/6 .*kinds=checked .*summary_census=[1-9][0-9]*' smoke.log
          if grep -q 'skipped(' smoke.log; then
            echo 'part of the quick suite did not run' >&2
            exit 1
          fi

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Real Windows PowerShell 5.1.  This is the only CI place these checks
      # meet the interpreter whose behaviours they exist to pin down.
      AGENTQ_SMOKE_PWSH: powershell.exe
    steps:
      - uses: actions/checkout@v5
      - name: PowerShell 5.1 client contracts
        shell: bash
        run: |
          # Actions runs bash without a profile, so Git's /usr/bin is not
          # ahead of System32 -- and C:\Windows\System32\find.exe shadows GNU
          # find inside these scripts.  Measured on a real Windows host; the
          # supported entry point adjusts PATH for the same reason.
          export PATH="/usr/bin:$PATH"
          fail=0
          # 13 and 25 join on 2026-10-20: their platform-gate cases are
          # non-Windows-only (the gate cannot fire on Windows), and BEFORE the
          # guard added that day a run here would have INSTALLED the client and
          # rewritten the runner's PATH.  The windows job is exactly where they
          # must be exercised: the guard is what keeps them safe, and a guard
          # that is only ever exercised off Windows is a guard nobody runs.
          for check in 12-ps-client-contract 13-ps-installer-contract 20-ps-native-argv-roundtrip 22-launcher-contract 23-durable-move-contract 25-ps-client-installer-contract; do
            log="smoke-$check.log"
            status=0
            "./smoke/$check.sh" >"$log" 2>&1 || status=$?
            printf '\n===== %s (exit %s) =====\n' "$check" "$status"
            cat "$log"
            if [ "$status" -ne 0 ]; then fail=1; fi
            if grep -q 'SKIPPED' "$log"; then
              echo "$check skipped -- it must run here" >&2
              fail=1
            fi
            # Every NOT-covered token must carry a NAMED platform reason.  On
            # this host 13 and 25 must additionally report the gate as
            # unverifiable (the gate cannot fire on Windows); a run that
            # claimed `platform-gate=covered` here would be asserting a case it
            # did not execute.
            # `|| true` is load-bearing: this step declares `shell: bash`, which
            # Actions runs as `bash --noprofile --norc -e -o pipefail`, so an
            # UNMATCHED grep makes the whole substitution fail and `set -e`
            # aborts the step.  Measured 2026-10-31 on windows-latest: smoke/20
            # prints no NOT-covered token at all (its normal, healthy output),
            # so `grep -o` answered 1, the step died at this line, and checks
            # 22/23/25 never ran -- their logs did not even exist for the
            # ps51= assertion below.  smoke/12 and smoke/13 kept the step alive
            # only because their own summaries happen to carry tokens.
            occurrences=$( (grep -o 'NOT-covered' "$log" || true) | wc -l | tr -d ' ')
            named=$( (grep -o 'NOT-covered([^)]*)' "$log" || true) | wc -l | tr -d ' ')
            if [ "$occurrences" -ne "$named" ]; then
              echo "$check printed a NOT-covered token with no parenthesised reason" >&2
              fail=1
            fi
            # The allowed reasons are the named platform boundaries this repo
            # has measured.  `deliberately-not-exercised` is the third one: on
            # Windows, 13/25 must never issue a valid installer invocation
            # (measuring 2026-10-20: doing so installs and edits the user's
            # PATH), so their staging cases are withheld BY CHOICE there rather
            # than being unreachable -- a different fact, and a different token.
            bad_tokens=$(grep -o 'NOT-covered([^)]*)' "$log" | grep -vE '^NOT-covered\((needs-Windows|needs-non-Windows|deliberately-not-exercised)\)$' || true)
            if [ -n "$bad_tokens" ]; then
              echo "$check reported NOT-covered without a named platform reason:" >&2
              echo "$bad_tokens" >&2
              fail=1
            fi
            case "$check" in
              13-ps-installer-contract|25-ps-client-installer-contract)
                if ! grep -q 'platform-gate=NOT-covered(needs-non-Windows)' "$log"; then
                  echo "$check claimed platform-gate coverage on a Windows host" >&2
                  fail=1
                fi
                ;;
            esac
          done
          exit "$fail"
      - name: Assert PS 5.1 was the interpreter
        if: always()
        shell: bash
        run: |
          # The ps51 token is what makes this job meaningful: without it the
          # same run under pwsh 7 would look identical and prove nothing about
          # 5.1.  smoke/12 prints `ps51=covered`; 20/22/23 each print a
          # `pwsh=<version>` token whose major version must be 5 -- without
          # per-check tokens a check that silently detaches from
          # AGENTQ_SMOKE_PWSH (as 23 measurably did on 2026-10-13) runs pwsh 7
          # while this job counts it as 5.1 evidence.
          grep -q 'ps51=covered' smoke-12-ps-client-contract.log
          fail=0
          for log in smoke-13-ps-installer-contract.log smoke-20-ps-native-argv-roundtrip.log smoke-22-launcher-contract.log smoke-23-durable-move-contract.log smoke-25-ps-client-installer-contract.log; do
            if ! grep -qE 'pwsh=5\.' "$log"; then
              echo "$log did not report PowerShell 5.1 as its interpreter" >&2
              fail=1
            fi
          done
          exit "$fail"
